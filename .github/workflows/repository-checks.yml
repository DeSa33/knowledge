name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify documents, links, and PDF integrity
        run: python3 scripts/verify_repository.py
      - name: Verify catalog metadata and generated index
        run: python3 scripts/catalog.py --check
      - name: Test multi-collection metadata contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
